openapi: 3.0.3
info:
  title: Autara
  version: 0.1.0
  description: >-
    Self-driving personal-finance agent that optimises bills, savings, debt, and
    product switches under suitability, explainability, and human-override controls.
  x-product-slug: ai-fin-autara
  x-source: ai-in-financial/WEF_New_Physics_of_Financial_Services/
servers:
  - url: https://api.example.com
tags:
  - name: Goals
    description: Customer goals and hard constraints
  - name: Accounts
    description: Multi-provider financial accounts and offers
  - name: Proposals
    description: Optimisation proposals awaiting gate or confirm
  - name: Actions
    description: Executed, reversed, and paused actions
  - name: Explanations
    description: Decision rationales and factor attributions
  - name: Complaints
    description: Conduct complaints and freezes
  - name: Governance
    description: Model versions, policies, and vendor dependencies
paths:
  /v1/customers/{customerId}/goals:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: listGoals
      tags: [Goals]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Goals page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeGoal"
    post:
      operationId: createGoal
      tags: [Goals]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreate"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeGoal"
  /v1/customers/{customerId}/constraints:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    post:
      operationId: createConstraint
      tags: [Goals]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Constraint"
      responses:
        "201":
          description: Constraint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConstraint"
  /v1/customers/{customerId}/accounts:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: listFinancialAccounts
      tags: [Accounts]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Accounts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeFinancialAccount"
  /v1/customers/{customerId}/product-offers:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: listProductOffers
      tags: [Accounts]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Comparable product offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeProductOffer"
  /v1/proposals:
    get:
      operationId: listActionProposals
      tags: [Proposals]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, rejected, expired, escalated]
      responses:
        "200":
          description: Proposals page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeActionProposal"
    post:
      operationId: createActionProposal
      tags: [Proposals]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionProposalCreate"
      responses:
        "201":
          description: Proposal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeActionProposal"
  /v1/proposals/{proposalId}/confirm:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    post:
      operationId: confirmActionProposal
      tags: [Proposals]
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Confirmation accepted for execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeExecutedAction"
  /v1/actions:
    get:
      operationId: listExecutedActions
      tags: [Actions]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Actions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeExecutedAction"
  /v1/actions/{actionId}/reverse:
    parameters:
      - $ref: "#/components/parameters/ActionId"
    post:
      operationId: reverseExecutedAction
      tags: [Actions]
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Reversal accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeExecutedAction"
  /v1/customers/{customerId}/automation/pause:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    post:
      operationId: pauseAutomation
      tags: [Actions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categories]
              properties:
                categories:
                  type: array
                  items:
                    type: string
                    enum: [bills, savings, switches, all]
      responses:
        "200":
          description: Automation paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCustomerProfile"
  /v1/explanations/{explanationId}:
    parameters:
      - $ref: "#/components/parameters/ExplanationId"
    get:
      operationId: getExplanationRecord
      tags: [Explanations]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Explanation record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeExplanationRecord"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/complaints:
    post:
      operationId: openComplaintCase
      tags: [Complaints]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintCaseCreate"
      responses:
        "201":
          description: Complaint opened and related automation frozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeComplaintCase"
  /v1/governance/model-versions:
    get:
      operationId: listModelVersions
      tags: [Governance]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Model versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeModelVersion"
    post:
      operationId: registerModelVersion
      tags: [Governance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelVersion"
      responses:
        "201":
          description: Model version registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeModelVersion"
  /v1/governance/model-versions/{modelVersionId}/approve:
    parameters:
      - $ref: "#/components/parameters/ModelVersionId"
    post:
      operationId: approveModelVersion
      tags: [Governance]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Model approved for production
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeModelVersion"
  /v1/governance/vendors:
    get:
      operationId: listVendorDependencies
      tags: [Governance]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Vendor dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeVendorDependency"
  /v1/customers/{customerId}/outcomes:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getOutcomeReport
      tags: [Explanations]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Outcome report versus baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOutcomeReport"
components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string }
    ActionId:
      name: actionId
      in: path
      required: true
      schema: { type: string }
    ExplanationId:
      name: explanationId
      in: path
      required: true
      schema: { type: string }
    ModelVersionId:
      name: modelVersionId
      in: path
      required: true
      schema: { type: string }
  responses:

    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:

    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    CustomerProfile:
      type: object
      required: [id, automationStatus]
      properties:
        id: { type: string }
        automationStatus:
          type: string
          enum: [active, paused, disabled]
        pausedCategories:
          type: array
          items: { type: string }
    Goal:
      type: object
      required: [id, customerId, type, targetAmount, status]
      properties:
        id: { type: string }
        customerId: { type: string }
        type:
          type: string
          enum: [emergencyBuffer, debtPaydown, savingsRate, feeMinimisation]
        targetAmount: { type: number, format: double }
        currency: { type: string }
        status:
          type: string
          enum: [active, achieved, cancelled]
    GoalCreate:
      type: object
      required: [type, targetAmount]
      properties:
        type:
          type: string
          enum: [emergencyBuffer, debtPaydown, savingsRate, feeMinimisation]
        targetAmount: { type: number, format: double }
        currency: { type: string, default: USD }
    Constraint:
      type: object
      required: [id, customerId, type, value]
      properties:
        id: { type: string }
        customerId: { type: string }
        type:
          type: string
          enum: [maxRisk, minBuffer, excludedProvider, maxAutoAmount]
        value: { type: string }
    FinancialAccount:
      type: object
      required: [id, customerId, provider, accountType, balance]
      properties:
        id: { type: string }
        customerId: { type: string }
        provider: { type: string }
        accountType:
          type: string
          enum: [checking, savings, credit, loan, investment]
        balance: { type: number, format: double }
        currency: { type: string }
        apr: { type: number, format: double }
    ProductOffer:
      type: object
      required: [id, provider, productType, headlineRate]
      properties:
        id: { type: string }
        provider: { type: string }
        productType: { type: string }
        headlineRate: { type: number, format: double }
        feesAnnual: { type: number, format: double }
        hostInstitutionProduct: { type: boolean }
    OptimisationPolicy:
      type: object
      required: [id, name, version, autoExecute]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        autoExecute: { type: boolean }
        materialityThreshold: { type: number, format: double }
    ActionProposal:
      type: object
      required: [id, customerId, actionType, status, material]
      properties:
        id: { type: string }
        customerId: { type: string }
        actionType:
          type: string
          enum: [payBill, savingsSweep, refinance, providerSwitch, allocationChange]
        status:
          type: string
          enum: [pending, confirmed, rejected, expired, escalated]
        material: { type: boolean }
        estimatedBenefit: { type: number, format: double }
        explanationId: { type: string }
        suitabilityCheckId: { type: string }
    ActionProposalCreate:
      type: object
      required: [customerId, actionType, material]
      properties:
        customerId: { type: string }
        actionType:
          type: string
          enum: [payBill, savingsSweep, refinance, providerSwitch, allocationChange]
        material: { type: boolean }
        estimatedBenefit: { type: number, format: double }
        policyId: { type: string }
    ExecutedAction:
      type: object
      required: [id, proposalId, status, executedAt]
      properties:
        id: { type: string }
        proposalId: { type: string }
        status:
          type: string
          enum: [executed, failed, reversed]
        executedAt: { type: string, format: date-time }
        reversedAt: { type: string, format: date-time }
    ExplanationRecord:
      type: object
      required: [id, proposalId, plainLanguage, factors]
      properties:
        id: { type: string }
        proposalId: { type: string }
        plainLanguage: { type: string }
        factors:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              contribution: { type: number, format: float }
    SuitabilityCheck:
      type: object
      required: [id, customerId, result, checkedAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        result:
          type: string
          enum: [pass, fail, escalate]
        perimeter: { type: string }
        checkedAt: { type: string, format: date-time }
    Confirmation:
      type: object
      required: [id, proposalId, confirmedBy, confirmedAt]
      properties:
        id: { type: string }
        proposalId: { type: string }
        confirmedBy: { type: string }
        confirmedAt: { type: string, format: date-time }
    ComplaintCase:
      type: object
      required: [id, customerId, actionId, status, openedAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        actionId: { type: string }
        status:
          type: string
          enum: [open, investigating, upheld, rejected, closed]
        freezeAutomation: { type: boolean }
        openedAt: { type: string, format: date-time }
    ComplaintCaseCreate:
      type: object
      required: [customerId, actionId, narrative]
      properties:
        customerId: { type: string }
        actionId: { type: string }
        narrative: { type: string }
    OutcomeReport:
      type: object
      required: [customerId, period, feesAvoided, interestDifferential]
      properties:
        customerId: { type: string }
        period: { type: string }
        feesAvoided: { type: number, format: double }
        interestDifferential: { type: number, format: double }
        goalProgressPct: { type: number, format: float }
    ModelVersion:
      type: object
      required: [id, name, version, status]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        status:
          type: string
          enum: [draft, approved, retired, rolledBack]
    VendorDependency:
      type: object
      required: [id, vendorName, capability, concentrationScore]
      properties:
        id: { type: string }
        vendorName: { type: string }
        capability: { type: string }
        concentrationScore: { type: number, format: float }
        exitPlanPresent: { type: boolean }

    DataEnvelopeGoal:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Goal"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeGoal:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Goal"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeConstraint:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Constraint"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeConstraint:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Constraint"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeFinancialAccount:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/FinancialAccount"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeFinancialAccount:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/FinancialAccount"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeProductOffer:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ProductOffer"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeProductOffer:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ProductOffer"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeActionProposal:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ActionProposal"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeActionProposal:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ActionProposal"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeExecutedAction:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ExecutedAction"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeExecutedAction:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ExecutedAction"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeCustomerProfile:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/CustomerProfile"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeCustomerProfile:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CustomerProfile"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeExplanationRecord:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ExplanationRecord"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeExplanationRecord:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ExplanationRecord"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeComplaintCase:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ComplaintCase"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeComplaintCase:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ComplaintCase"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeModelVersion:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ModelVersion"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeModelVersion:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ModelVersion"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeVendorDependency:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/VendorDependency"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeVendorDependency:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/VendorDependency"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeOutcomeReport:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/OutcomeReport"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeOutcomeReport:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OutcomeReport"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"

