openapi: 3.1.0
info:
  title: Autara Explanations API
  version: 0.1.0
  description: Plain-language rationales and decision factor attributions (BR-3).
  x-domain: xpl
  license:
    name: Proprietary
servers:
  - url: https://api.autara.local
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: Explanations
paths:
  /v1/explanations:
    get:
      operationId: listExplanationRecords
      tags: [Explanations]
      x-repository: ExplanationRecord
      x-dynamodb:
        entityType: EXPLANATION
        pkPatternTemplate: "EXPLANATION#${explanationId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
        filterFields: [customerId, proposalId]
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: customerId
          in: query
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/CustomerId
        - name: proposalId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Explanation ledger
          content:
            application/json:
              schema:
                $ref: ./explanations.schemas.yaml#/components/schemas/ExplanationRecordListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/explanations/{explanationId}:
    get:
      operationId: getExplanationRecord
      tags: [Explanations]
      x-repository: ExplanationRecord
      x-dynamodb:
        entityType: EXPLANATION
        pkPatternTemplate: "EXPLANATION#${explanationId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - name: explanationId
          in: path
          required: true
          schema:
            $ref: ./explanations.schemas.yaml#/components/schemas/ExplanationId
      responses:
        '200':
          description: Explanation record
          content:
            application/json:
              schema:
                $ref: ./explanations.schemas.yaml#/components/schemas/ExplanationRecordResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
