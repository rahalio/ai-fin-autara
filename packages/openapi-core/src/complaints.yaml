openapi: 3.1.0
info:
  title: Autara Complaints API
  version: 0.1.0
  description: Conduct complaints that freeze related automation and preserve decision packets (BR-9).
  x-domain: cmp
  license:
    name: Proprietary
servers:
  - url: https://api.autara.local
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: Complaints
paths:
  /v1/complaints:
    get:
      operationId: listComplaintCases
      tags: [Complaints]
      x-repository: ComplaintCase
      x-dynamodb:
        entityType: COMPLAINT
        pkPatternTemplate: "COMPLAINT#${complaintId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
        filterFields: [status, customerId]
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema:
            $ref: ./complaints.schemas.yaml#/components/schemas/ComplaintStatus
        - name: customerId
          in: query
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/CustomerId
      responses:
        '200':
          description: Complaint cases
          content:
            application/json:
              schema:
                $ref: ./complaints.schemas.yaml#/components/schemas/ComplaintCaseListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: openComplaintCase
      tags: [Complaints]
      x-repository: ComplaintCase
      x-dynamodb:
        entityType: COMPLAINT
        pkPatternTemplate: "COMPLAINT#${complaintId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./complaints.schemas.yaml#/components/schemas/ComplaintCaseCreate
      responses:
        '201':
          description: Complaint opened and related automation frozen
          content:
            application/json:
              schema:
                $ref: ./complaints.schemas.yaml#/components/schemas/ComplaintCaseResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/complaints/{complaintId}:
    get:
      operationId: getComplaintCase
      tags: [Complaints]
      x-repository: ComplaintCase
      x-dynamodb:
        entityType: COMPLAINT
        pkPatternTemplate: "COMPLAINT#${complaintId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - name: complaintId
          in: path
          required: true
          schema:
            $ref: ./complaints.schemas.yaml#/components/schemas/ComplaintId
      responses:
        '200':
          description: Complaint with preserved decision packet link
          content:
            application/json:
              schema:
                $ref: ./complaints.schemas.yaml#/components/schemas/ComplaintCaseResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/complaints/{complaintId}/resolve:
    post:
      operationId: resolveComplaintCase
      tags: [Complaints]
      x-repository: ComplaintCase
      x-dynamodb:
        entityType: COMPLAINT
        pkPatternTemplate: "COMPLAINT#${complaintId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
        - name: complaintId
          in: path
          required: true
          schema:
            $ref: ./complaints.schemas.yaml#/components/schemas/ComplaintId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./complaints.schemas.yaml#/components/schemas/ResolveComplaintRequest
      responses:
        '200':
          description: Complaint resolved
          content:
            application/json:
              schema:
                $ref: ./complaints.schemas.yaml#/components/schemas/ComplaintCaseResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
