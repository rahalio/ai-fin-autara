openapi: 3.1.0
info:
  title: Autara Outcomes API
  version: 0.1.0
  description: Fees avoided, interest differential, and goal progress versus no-automation baseline (BR-7).
  x-domain: out
  license:
    name: Proprietary
servers:
  - url: https://api.autara.local
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: Outcomes
paths:
  /v1/customers/{customerId}/outcomes:
    get:
      operationId: getOutcomeReport
      tags: [Outcomes]
      x-repository: OutcomeReport
      x-dynamodb:
        entityType: OUTCOME
        pkPatternTemplate: "CUSTOMER#${customerId}"
        skPatternTemplate: "OUTCOME#${period}"
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/CustomerIdPath
        - name: period
          in: query
          schema:
            type: string
            description: Period key such as 2026-09
      responses:
        '200':
          description: Outcome report versus baseline
          content:
            application/json:
              schema:
                $ref: ./outcomes.schemas.yaml#/components/schemas/OutcomeReportResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/outcomes/overview:
    get:
      operationId: getOutcomesOverview
      tags: [Outcomes]
      x-repository: OutcomesOverview
      x-dynamodb:
        entityType: OUTCOMES_OVERVIEW
        pkPatternTemplate: "OUTCOMES#OVERVIEW"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      responses:
        '200':
          description: Aggregated outcomes telemetry for product owners
          content:
            application/json:
              schema:
                $ref: ./outcomes.schemas.yaml#/components/schemas/OutcomesOverviewResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
