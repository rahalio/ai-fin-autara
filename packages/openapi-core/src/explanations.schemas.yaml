openapi: 3.1.0
info:
  title: Autara explanations schemas
  version: 0.1.0
paths: {}
components:
  schemas:
    ExplanationId:
      type: string
      pattern: '^xpl_[0-9A-HJKMNP-TV-Z]{26}$'
    DecisionFactor:
      type: object
      required: [name, contribution]
      properties:
        name:
          type: string
        contribution:
          type: number
          format: float
    ExplanationRecord:
      type: object
      required: [explanationId, proposalId, customerId, plainLanguage, factors, createdAt]
      properties:
        explanationId:
          $ref: '#/components/schemas/ExplanationId'
        proposalId:
          type: string
        customerId:
          $ref: ./common/primitives.yaml#/components/schemas/CustomerId
        plainLanguage:
          type: string
        factors:
          type: array
          items:
            $ref: '#/components/schemas/DecisionFactor'
        policyVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExplanationRecordResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ExplanationRecord'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    ExplanationRecordListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExplanationRecord'
        nextCursor:
          type: string
    ExplanationRecordListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ExplanationRecordListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
